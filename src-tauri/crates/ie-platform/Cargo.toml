[package]
name = "ie-platform"
description = "Operating-system abstractions and per-platform adapters for Inner Empire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
time = { version = "0.3", features = ["local-offset"] }

# Desktop-only backends. `notify` has no iOS implementation and would fall back
# to polling a thousand files; `directories` has no iOS mapping and would hand
# back XDG paths inside the app container. Both are optional so an iOS build can
# leave them out entirely rather than link them and never call them.
directories = { version = "6", optional = true }
notify = { version = "8", optional = true }
notify-debouncer-full = { version = "0.5", optional = true }

[features]
default = ["desktop-backends"]
desktop-backends = ["dep:directories", "dep:notify", "dep:notify-debouncer-full"]

[dev-dependencies]
tempfile.workspace = true
