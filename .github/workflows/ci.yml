name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Everything that is platform-independent runs once rather than twice.
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The Rust suite runs on both targets, because the things it checks —
  # atomic writes, case sensitivity, path handling, filesystem watching —
  # are exactly the things that differ between them.
  rust:
    name: Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      # The core must stay free of Tauri and of platform conditionals. Both
      # are checkable, so both are checked rather than left to review.
      - name: Core has no platform conditionals
        shell: bash
        run: |
          if grep -rnE '#\[cfg\((target_os|windows|unix)' src-tauri/crates/ie-core/src; then
            echo "::error::ie-core must not contain platform conditionals; they belong in ie-platform/src/platform."
            exit 1
          fi
          if grep -rn 'tauri' src-tauri/crates/ie-core/Cargo.toml; then
            echo "::error::ie-core must not depend on Tauri."
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace

  # The conformance corpus is what keeps the Rust and TypeScript Markdown
  # implementations from drifting, so it gets its own visible job.
  conformance:
    name: Markdown conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Rust half
        run: cargo test --manifest-path src-tauri/Cargo.toml -p ie-core --test conformance

      - name: TypeScript half
        run: pnpm test src/markdown/conformance.test.ts

  # A desktop build on both targets, so a change that breaks packaging is
  # caught on the branch rather than at release time.
  desktop:
    name: Desktop build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - run: pnpm install --frozen-lockfile

      - name: Build the application
        run: pnpm build && cargo build --manifest-path src-tauri/Cargo.toml --release

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
